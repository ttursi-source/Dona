<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curaduría | Motor de Lujo</title>
    <style>
        :root {
            --bg: #f9f9f8;
            --ink: #111;
            --grid-line: #111;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 2rem;
            border-bottom: 1px solid var(--ink);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 8rem);
            line-height: 0.8;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        .categories {
            display: flex;
            gap: 2rem;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--ink);
            overflow-x: auto;
        }

        .category-btn {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            color: #888;
            transition: color 0.2s ease;
        }

        .category-btn.active {
            color: var(--ink);
        }

        .category-btn:hover { color: var(--ink); }

        /* Grilla asimétrica brutalista */
        #product-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1px;
            background-color: var(--grid-line);
            border-bottom: 1px solid var(--grid-line);
        }

        .product-card {
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: var(--ink);
            position: relative;
            overflow: hidden;
            height: 60vh;
        }

        /* Clases dinámicas generadas por el backend */
        .span-4 { grid-column: span 4; }
        .span-6 { grid-column: span 6; }
        .span-8 { grid-column: span 8; }
        .span-12 { grid-column: span 12; }

        @media (max-width: 900px) {
            .product-card { grid-column: span 12 !important; height: 50vh; }
        }

        .img-container {
            flex-grow: 1;
            overflow: hidden;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.6s ease, transform 6s ease;
        }

        .product-card:hover .img-container img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .meta {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--grid-line);
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .price { font-family: monospace; font-size: 1rem; }
        
        .market-link {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--ink);
            color: var(--bg);
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .product-card:hover .market-link { opacity: 1; }

        #sentinel {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>C/Lujo</h1>
        <div class="stats">VOL. I / ALGORITMO ACTIVO</div>
    </header>

    <nav class="categories" id="category-nav">
        <button class="category-btn active" data-cat="all">Todo</button>
        <button class="category-btn" data-cat="autos">Hiperautos</button>
        <button class="category-btn" data-cat="relojes">Alta Relojería</button>
        <button class="category-btn" data-cat="bienes_raices">Real Estate</button>
    </nav>

    <main id="product-grid"></main>
    <div id="sentinel">Cargando catálogo...</div>

    <script>
        const grid = document.getElementById('product-grid');
        const sentinel = document.getElementById('sentinel');
        const categoryBtns = document.querySelectorAll('.category-btn');
        
        let currentPage = 1;
        let currentCategory = 'all';
        let isLoading = false;

        // Factory de componentes HTML
        const createCard = (item) => {
            return `
                <a href="${item.marketplace}" target="_blank" class="product-card span-${item.grid_span}">
                    <div class="market-link">Ver en Marketplace ↗</div>
                    <div class="img-container">
                        <img src="${item.image}" alt="${item.brand} ${item.model}" loading="lazy">
                    </div>
                    <div class="meta">
                        <div class="brand">${item.brand} — ${item.model}</div>
                        <div class="price">${item.price}</div>
                    </div>
                </a>
            `;
        };

        // Lógica de consumo de la API
        const fetchProducts = async () => {
            if (isLoading) return;
            isLoading = true;
            
            try {
                const response = await fetch(`http://localhost:8000/api/products?category=${currentCategory}&page=${currentPage}`);
                const data = await response.json();
                
                data.items.forEach(item => {
                    grid.insertAdjacentHTML('beforeend', createCard(item));
                });
                
                currentPage++;
            } catch (error) {
                console.error("Error conectando al motor:", error);
                sentinel.innerText = "Motor desconectado. Levanta FastAPI.";
            } finally {
                isLoading = false;
            }
        };

        // Scroll Infinito con IntersectionObserver
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                fetchProducts();
            }
        }, { rootMargin: '200px' });

        observer.observe(sentinel);

        // Lógica de Categorías
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                currentCategory = e.target.getAttribute('data-cat');
                currentPage = 1;
                grid.innerHTML = ''; // Limpiar grilla
                fetchProducts(); // Cargar nueva categoría
            });
        });
    </script>
</body>
</html>
